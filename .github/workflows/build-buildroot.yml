name: Build BeagleBone Black Image with Tester

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Buildroot
      uses: actions/checkout@v4
      with:
        repository: 'buildroot/buildroot' # Using the official Buildroot repo
        path: 'buildroot'

    - name: Checkout beagle-tester
      uses: actions/checkout@v4
      with:
        repository: 'VidhuSarwal/beagle-tester'
        path: 'buildroot/package/beagle-tester'

    - name: Install Buildroot dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential libncurses5-dev

    - name: Configure and Build for BeagleBone Black
      # This directive ensures all commands in 'run' execute inside the 'buildroot' directory
      working-directory: ./buildroot
      run: |
        # --- DEBUGGING STEP ---
        # 1. Print the current working directory to confirm we are in the right place
        echo "Current directory: $(pwd)"
        
        # 2. List the contents of the 'configs' directory to ensure the defconfig file exists
        echo "Checking for beaglebone_defconfig..."
        ls -F configs/ | grep 'beaglebone'

        # --- BUILD STEPS ---
        # 3. Apply the default BeagleBone Black configuration
        make beaglebone_defconfig
        
        # 4. Enable the beagle-tester package
        echo "BR2_PACKAGE_BEAGLE_TESTER=y" >> .config
        
        # 5. Update the configuration
        make olddefconfig

        # 6. Run the build
        echo "Starting Buildroot make..."
        make

    - name: Upload Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: beaglebone-black-image
        path: buildroot/output/images/sdcard.img
